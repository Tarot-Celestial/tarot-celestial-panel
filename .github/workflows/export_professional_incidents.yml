name: Export Professional Incidents ZIP
on:
  push:
    branches:
      - export/professional-incidents-zip
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare package
        run: |
          mkdir -p package
          cp --parents SQL_INCIDENCIAS_JORNADA_PROFESIONAL.sql package/
          cp --parents src/app/admin/page.tsx package/
          cp --parents src/app/api/admin/cerebro/health/route.ts package/
          cp --parents src/app/api/attendance/incidents/route.ts package/
          cp --parents src/app/api/incidents/my/route.ts package/
          cp --parents src/app/panel-central/page.tsx package/
          cp --parents src/app/panel-tarotista/page.tsx package/
          cp --parents src/components/attendance/AttendanceIncidentCenter.module.css package/
          cp --parents src/components/attendance/AttendanceIncidentCenter.tsx package/
          cp --parents src/components/tarotista/TarotistaInvoiceDashboard.tsx package/
      - uses: actions/upload-artifact@v4
        with:
          name: Tarot_Celestial_Incidencias_Profesional
          path: package
          if-no-files-found: error
          compression-level: 9
