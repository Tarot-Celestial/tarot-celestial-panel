name: Brain Phase 6 Artifact
on:
  push:
    branches:
      - brain-phase6-lifecycle-deployments
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: cerebro-celestial-fase-6-lifecycle
          if-no-files-found: error
          retention-days: 1
          path: |
            SQL_CEREBRO_FASE_6_LIFECYCLE.sql
            src/lib/server/brain-observability.ts
            src/app/api/admin/cerebro/health/route.ts
            src/features/brain/CelestialBrain.tsx
            src/features/brain/CelestialBrain.module.css
