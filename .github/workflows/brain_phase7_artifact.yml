name: Brain Phase 7 Artifact
on:
  push:
    branches:
      - brain-phase7-preventivo
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: cerebro-celestial-fase-7-preventivo
          if-no-files-found: error
          retention-days: 1
          path: |
            src/app/api/admin/cerebro/health/route.ts
            src/features/brain/CelestialBrain.tsx
            src/features/brain/CelestialBrain.module.css
            src/features/brain/BrainPreventivePanel.tsx
            src/features/brain/BrainPreventivePanel.module.css
            src/features/brain/celestial-brain-forecast.ts
