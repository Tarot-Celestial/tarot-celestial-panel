name: Brain Phase 4 Artifact
on:
  push:
    branches:
      - brain-phase4-diagnostico-inteligente
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Package modified files
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-celestial-fase-4-diagnostico
          if-no-files-found: error
          retention-days: 1
          path: |
            src/app/api/admin/cerebro/health/route.ts
            src/features/brain/CelestialBrain.tsx
            src/features/brain/CelestialBrain.module.css
            src/features/brain/celestial-brain-diagnostics.ts
